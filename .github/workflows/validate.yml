name: Package and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install pinned image dependency
        run: python -m pip install -r requirements-build.txt
      - name: Test release validation
        run: python -m unittest discover -s tools/tests -p test_release_bundle.py -v
      - name: Verify and package hardware-tested program with full resources
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/release_bundle.py build --tag "$RELEASE_TAG"
      - name: Upload complete installation and checksums
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: H1PVZ-install-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Download the exact uploaded artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: dist/download-check/
      - name: Verify downloaded files and installation ZIP
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/release_bundle.py verify --directory dist/download-check --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.event_name != 'pull_request'
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download the verified artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.snapshot.outputs.artifact-id }}
          path: release/
      - name: Check final asset hashes
        working-directory: release
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Publish version tag without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "植物僵尸 $RELEASE_TAG" --notes-file release/RELEASE-NOTES.md "${flags[@]}"
      - name: Download published assets and verify their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir published
          cd published
          sha256sum --strict --check SHA256SUMS.txt
